[project]
name = "course-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lzy", email = "lizuying2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
course-management = "course_management:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs[compatible-mypy]>=3.18.2",
    "mypy>=2.4.1",
    "types-django-filter>=26.2.0.20261107",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[tool.django-stubs]
django_settings_module = "config.settings"
